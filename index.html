  <script>
    (function () {
      var frame = document.getElementById('puzzlesAppFrame');
      var description = document.querySelector('meta[name="description"]');
      var revealed = false;
      var started = performance.now();

      function reveal() {
        if (revealed) return;
        var elapsed = performance.now() - started;
        var wait = Math.max(0, 520 - elapsed);
        window.setTimeout(function () {
          if (revealed) return;
          revealed = true;
          document.body.classList.add('is-ready');
        }, wait);
      }

      window.addEventListener('message', function (event) {
        if (event.source !== frame.contentWindow || !event.data) return;
        if (event.data.type === 'PUZZLES_FRAME_READY') reveal();
        if (event.data.type !== 'PUZZLES_META') return;
        if (typeof event.data.title === 'string' && event.data.title.trim()) {
          document.title = event.data.title.trim();
          frame.title = event.data.title.trim();
        }
        if (description && typeof event.data.description === 'string' && event.data.description.trim()) {
          description.setAttribute('content', event.data.description.trim());
        }
      });

      frame.addEventListener('load', function () {
        window.setTimeout(reveal, 80);
      }, { once: true });
      window.setTimeout(reveal, 1100);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (items) {
          items.forEach(function (registration) { registration.unregister(); });
        }).catch(function () {});
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.filter(function (key) { return /^puzzles-/i.test(key); }).forEach(function (key) { caches.delete(key); });
        }).catch(function () {});
      }
    })();
  </script>
