<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>PUZZLES · Sin conexión</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }

    main {
      width: min(520px, 100%);
      padding: 28px;
      border: 1px solid #343434;
      border-top-color: #d89a00;
      background: #111;
      text-align: center;
    }

    img {
      width: min(330px, 90%);
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 500;
      text-transform: uppercase;
    }

    p {
      margin: 0;
      color: #bdbdbd;
      line-height: 1.55;
    }

    button {
      min-height: 46px;
      margin-top: 20px;
      padding: 0 20px;
      border: 0;
      border-radius: 0;
      background: #d89a00;
      color: #000;
      font-weight: 800;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <img
      src="./assets/puzzles_logo.png?v=1.6.0-editorial-security"
      alt="PUZZLES"
    >

    <h1>Falta una pieza: conexión</h1>

    <p>
      La aplicación está instalada, pero el catálogo necesita
      conexión para validar productos, precios y disponibilidad.
    </p>

    <button type="button" onclick="location.reload()">
      Reintentar
    </button>
  </main>
</body>
</html>

<!-- PUZZLES 1.6.0 · modo sin conexión -->
<style>
  main img {
    display: block;
    width: min(220px, 62vw) !important;
    height: auto !important;
    max-height: 210px !important;
    margin: 0 auto 20px !important;
    object-fit: contain !important;
  }
</style>
